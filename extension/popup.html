<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    body { font-family: system-ui, sans-serif; width: 240px; margin: 0; padding: 16px; color: #16151a; background: #fff; }
    @media (prefers-color-scheme: dark) { body { color: #f2f0f7; background: #1c1a24; } }
    p { margin: 0 0 4px; font-size: 13px; }
    .muted { opacity: .65; font-size: 12px; margin-bottom: 14px; }
    button { width: 100%; padding: 10px; border: 0; border-radius: 10px; font-weight: 600; color: #fff; cursor: pointer;
      background: linear-gradient(135deg, #5b4cf0, #8a5cf6); }
  </style>
</head>
<body>
  <p id="who">Checking…</p>
  <p class="muted" id="exp"></p>
  <button id="lock">Lock browser now</button>
  <script src="popup.js"></script>
</body>
</html>
