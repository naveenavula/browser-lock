<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in</title>
  <link rel="stylesheet" href="lock.css" />
</head>
<body>
  <div class="shell">
    <!-- Left: steps -->
    <section class="pane">
      <div class="progress" aria-hidden="true"><span id="bar"></span></div>

      <form id="email-form" class="step" autocomplete="off" novalidate>
        <h1>What's your email?</h1>
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="you@example.com" spellcheck="false" autofocus />
        <p class="hint">We'll send a 6-digit code to this address.</p>
        <footer>
          <p class="fine">Only the owner of this browser can sign in.</p>
          <button type="submit" id="email-btn" disabled>Next <span class="kbd">↵</span></button>
        </footer>
      </form>

      <form id="code-form" class="step" autocomplete="off" hidden>
        <h1>Check your email</h1>
        <p class="sub">Enter the code sent to <strong id="sent-to"></strong></p>
        <div class="code" id="code">
          <input inputmode="numeric" maxlength="1" aria-label="Digit 1" />
          <input inputmode="numeric" maxlength="1" aria-label="Digit 2" />
          <input inputmode="numeric" maxlength="1" aria-label="Digit 3" />
          <input inputmode="numeric" maxlength="1" aria-label="Digit 4" />
          <input inputmode="numeric" maxlength="1" aria-label="Digit 5" />
          <input inputmode="numeric" maxlength="1" aria-label="Digit 6" />
        </div>
        <div class="links">
          <button type="button" class="link" id="resend">Resend code</button>
          <button type="button" class="link" id="change">Use a different email</button>
        </div>
        <footer>
          <button type="button" class="ghost" id="back">Back</button>
          <button type="submit" id="code-btn" disabled>Unlock <span class="kbd">↵</span></button>
        </footer>
      </form>

      <div id="done" class="step center" hidden>
        <div class="check" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="28" height="28"><path fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        </div>
        <h1>You're in</h1>
        <p class="sub">Opening your browser…</p>
      </div>

      <p id="msg" class="msg" role="alert"></p>
    </section>

    <!-- Right: illustration -->
    <aside class="art" aria-hidden="true">
      <div class="frame">
        <div class="tabbar"><span class="tab"></span></div>
        <div class="toolbar">
          <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
          <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
          <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg>
          <span class="url"></span>
        </div>
        <div class="canvas">
          <div class="orb"></div>
          <div class="search">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>
            <span class="caret"></span>
          </div>
        </div>
      </div>
    </aside>
  </div>
  <script type="module" src="lock.js"></script>
</body>
</html>
